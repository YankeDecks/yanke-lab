<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Yanke Bionics — Front Desk Decision Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#231f20;--black-mid:#2a2627;--muted:#9e9a9b;--green:#b0d235;--green-dk:#6a8010;--green-bg:#f4f9e8;--green-border:#cce040;
    --bg:#f5f5f3;--surface:#ffffff;--surface2:#f9faf6;--border:#e2e6d8;--border-dk:#c8cebc;
    --text-hi:#1a1718;--text-mid:#4a4547;--text-dim:#888080;--text-faint:#bbb5b0;
    --clarity:#2a5c8a;--clarity-bg:#ddeaf6;--clarity-border:#4a8ab5;
    --composure:#6a40a8;--composure-bg:#ede8f8;--composure-border:#9a70d8;
    --docs:#3a7a50;--docs-bg:#e4f4ea;--docs-border:#68b880;
    --voice:#b05010;--voice-bg:#faeadb;--voice-border:#d4763b;
    --flow:#2a7a8a;--flow-bg:#d8f0f4;--flow-border:#4aaabb;
    --positive:#3a7a50;--negative:#c03030;--neutral:#c07818;--red-bg:#fceaea;--amber:#c07818;--amber-bg:#fdf3dc;
    --radius:10px;--radius-sm:6px;--radius-lg:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text-hi);min-height:100dvh;overflow-x:hidden}
  .app{max-width:600px;margin:0 auto;padding:0 0 32px;min-height:100dvh;display:flex;flex-direction:column}
  .header{background:var(--black);padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .header-left{display:flex;flex-direction:column;gap:1px}
  .header-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--green)}
  .header-title{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:0.5px;color:#fff;line-height:1}
  .header-badge{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--black);background:var(--green);padding:3px 8px;border-radius:4px}
  .progress-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px}
  .progress-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green-dk),var(--green));transition:width 0.5s cubic-bezier(0.4,0,0.2,1);border-radius:2px}
  .progress-label{font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;font-weight:700;color:var(--text-dim);letter-spacing:1px;min-width:44px;text-align:right}
  .score-bar{display:flex;background:var(--surface);border-bottom:2px solid var(--border)}
  .score-item{flex:1;padding:9px 6px 8px;text-align:center;position:relative;border-right:1px solid var(--border)}
  .score-item:last-child{border-right:none}
  .score-item.clarity-item{background:linear-gradient(180deg,rgba(42,92,138,0.04),transparent)}
  .score-item.composure-item{background:linear-gradient(180deg,rgba(106,64,168,0.04),transparent)}
  .score-item.docs-item{background:linear-gradient(180deg,rgba(58,122,80,0.04),transparent)}
  .score-item.voice-item{background:linear-gradient(180deg,rgba(176,80,16,0.04),transparent)}
  .score-item.flow-item{background:linear-gradient(180deg,rgba(42,122,138,0.04),transparent)}
  .score-item .s-label{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:2px;display:block}
  .score-item .s-value{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:800;line-height:1;display:block}
  .score-item .s-value.clarity{color:var(--clarity)}.score-item .s-value.composure{color:var(--composure)}.score-item .s-value.docs{color:var(--docs)}.score-item .s-value.voice{color:var(--voice)}.score-item .s-value.flow{color:var(--flow)}
  .card-outer{flex:1;padding:14px 14px 0;display:flex;flex-direction:column}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);flex:1;display:flex;flex-direction:column;overflow:hidden;animation:cardIn 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 1px 4px rgba(35,31,32,0.06),0 4px 16px rgba(35,31,32,0.04)}
  .card-accent-bar{height:4px;background:var(--green);flex-shrink:0}
  .card-accent-bar.checkin{background:var(--composure)}
  .card-accent-bar.offwork{background:var(--amber)}
  .card-body{padding:18px 18px 0;flex:1;display:flex;flex-direction:column}
  .card-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .card-category{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--green-dk);background:var(--green-bg);border:1px solid var(--green-border);padding:2px 8px;border-radius:3px}
  .card-category.checkin{color:var(--composure);background:var(--composure-bg);border-color:var(--composure-border)}
  .card-num{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:700;color:var(--text-faint);letter-spacing:1px;margin-left:auto}
  .card-context{font-size:0.82rem;color:var(--text-mid);line-height:1.5;font-style:italic;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .card-question{font-size:1.05rem;font-weight:600;line-height:1.55;color:var(--text-hi);margin-bottom:18px;flex:1}
  .card-callback{font-size:0.76rem;color:var(--amber);line-height:1.5;background:var(--amber-bg);border:1px solid #e8c070;border-left:3px solid var(--amber);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:12px}
  .callback-tag{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--amber);display:block;margin-bottom:3px}
  .choices{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
  .choice-btn{background:var(--surface2);border:1.5px solid var(--border-dk);border-radius:var(--radius);padding:12px 14px;min-height:48px;color:var(--text-mid);font-family:'Barlow',sans-serif;font-size:0.9rem;font-weight:500;text-align:left;cursor:pointer;transition:all 0.15s ease;line-height:1.45;position:relative;overflow:hidden}
  .choice-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);opacity:0;transition:opacity 0.15s ease}
  .choice-btn:hover{border-color:var(--green);background:var(--green-bg);color:var(--text-hi);transform:translateX(2px)}
  .choice-btn:hover::before{opacity:1}.choice-btn:active{transform:translateX(1px) scale(0.99)}
  .choice-btn.selected{border-color:var(--green);background:var(--green-bg);color:var(--text-hi);font-weight:600}
  .choice-btn.selected::before{opacity:1}.choice-btn:disabled{cursor:default}.choice-btn:disabled:not(.selected){opacity:0.4}
  .result{padding:0 14px 14px;animation:resultIn 0.25s ease}
  @keyframes resultIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .result-score-block{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px}
  .result-delta{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:800;min-width:48px;line-height:1}
  .result-delta.pos{color:var(--positive)}.result-delta.neg{color:var(--negative)}.result-delta.zero{color:var(--neutral)}
  .result-stat-info{display:flex;flex-direction:column}
  .result-axis{font-family:'Barlow Condensed',sans-serif;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-mid)}
  .result-now{font-size:0.68rem;color:var(--text-dim);margin-top:1px}
  .result-feedback{font-size:0.88rem;line-height:1.6;color:var(--text-mid);margin-bottom:12px}
  .next-btn{width:100%;padding:13px;min-height:48px;background:var(--black);color:var(--green);border:none;border-radius:var(--radius);font-family:'Barlow Condensed',sans-serif;font-size:0.92rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all 0.15s ease}
  .next-btn:hover{background:var(--black-mid)}.next-btn:active{transform:scale(0.99)}
  .start-screen{flex:1;display:flex;flex-direction:column;animation:cardIn 0.4s ease}
  .start-hero{background:var(--black);padding:32px 22px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
  .start-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--green)}
  .start-main-title{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;color:#fff;line-height:1.05;letter-spacing:0.5px}
  .start-sub{font-size:0.9rem;color:var(--muted);line-height:1.6;max-width:480px}
  .start-tagline{font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-top:4px}
  .start-body{background:var(--surface);flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
  .start-axes{display:flex;flex-direction:column;gap:8px}
  .axis-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);border:1px solid}
  .axis-row.clarity-row{background:var(--clarity-bg);border-color:var(--clarity-border)}
  .axis-row.composure-row{background:var(--composure-bg);border-color:var(--composure-border)}
  .axis-row.docs-row{background:var(--docs-bg);border-color:var(--docs-border)}
  .axis-row.voice-row{background:var(--voice-bg);border-color:var(--voice-border)}
  .axis-row.flow-row{background:var(--flow-bg);border-color:var(--flow-border)}
  .axis-name{font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;min-width:90px}
  .axis-name.clarity{color:var(--clarity)}.axis-name.composure{color:var(--composure)}.axis-name.docs{color:var(--docs)}.axis-name.voice{color:var(--voice)}.axis-name.flow{color:var(--flow)}
  .axis-desc{font-size:0.78rem;color:var(--text-mid);line-height:1.4}
  .start-divider{height:1px;background:var(--border)}
  .start-note{font-size:0.8rem;color:var(--text-dim);line-height:1.6}
  .start-btn{padding:14px;min-height:48px;background:var(--black);color:var(--green);border:none;border-radius:var(--radius);font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.15s ease;margin-top:auto}
  .start-btn:hover{background:var(--black-mid)}
  .end-screen{flex:1;display:flex;flex-direction:column;animation:cardIn 0.4s ease}
  .end-hero{background:var(--black);padding:24px 22px 20px}
  .end-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
  .end-title{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;color:#fff}
  .end-scores{display:flex;background:var(--surface);border-bottom:2px solid var(--border)}
  .end-stat{flex:1;text-align:center;padding:14px 8px;border-right:1px solid var(--border)}
  .end-stat:last-child{border-right:none}
  .end-stat.e-clarity{background:linear-gradient(180deg,rgba(42,92,138,0.05),transparent)}
  .end-stat.e-composure{background:linear-gradient(180deg,rgba(106,64,168,0.05),transparent)}
  .end-stat.e-docs{background:linear-gradient(180deg,rgba(58,122,80,0.05),transparent)}
  .end-stat.e-voice{background:linear-gradient(180deg,rgba(176,80,16,0.05),transparent)}
  .end-stat.e-flow{background:linear-gradient(180deg,rgba(42,122,138,0.05),transparent)}
  .end-val{font-family:'Barlow Condensed',sans-serif;font-size:2.2rem;font-weight:800;line-height:1;margin-bottom:3px}
  .end-lbl{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim)}
  .end-body{flex:1;padding:20px 18px;background:var(--surface);display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  .end-insight{font-size:0.9rem;color:var(--text-mid);line-height:1.7}
  .end-divider{height:1px;background:var(--border)}
  .play-again{padding:13px;background:var(--black);color:var(--green);border:none;border-radius:var(--radius);font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.15s ease;margin-top:8px}
  .play-again:hover{background:var(--black-mid)}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* Walkthrough tutorial annotations */
  .wt-tutorial{font-size:0.82rem;line-height:1.6;color:var(--composure);background:var(--composure-bg);border:1px solid var(--composure-border);border-left:3px solid var(--composure);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px}
  .wt-tutorial strong{color:var(--composure);font-weight:700}
  .wt-tutorial em{font-style:italic}

  /* Hub deck selector */
  .hub-screen{flex:1;display:flex;flex-direction:column;animation:cardIn 0.4s ease}
  .hub-hero{background:var(--black);padding:32px 22px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .hub-body{background:var(--surface);flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
  .deck-card{background:var(--surface2);border:1.5px solid var(--border-dk);border-radius:var(--radius);padding:16px 16px 14px;cursor:pointer;transition:all 0.15s ease;position:relative;overflow:hidden}
  .deck-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;opacity:0;transition:opacity 0.15s ease}
  .deck-card:hover{transform:translateX(3px);border-color:var(--text-dim)}
  .deck-card:hover::before{opacity:1}
  .deck-card:active{transform:translateX(1px) scale(0.99)}
  .deck-card .dc-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .deck-card .dc-title{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:0.5px;color:var(--text-hi)}
  .deck-card .dc-badge{font-family:'Barlow Condensed',sans-serif;font-size:0.52rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#fff;padding:2px 7px;border-radius:3px;margin-left:auto}
  .deck-card .dc-desc{font-size:0.78rem;color:var(--text-mid);line-height:1.5}
  .deck-card .dc-meta{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-top:8px}

  .back-btn{font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;min-height:44px;cursor:pointer;transition:all 0.15s ease;margin-top:4px}
  .back-btn:hover{border-color:var(--text-mid);color:var(--text-mid)}

  /* Locked deck cards */
  .deck-card.locked{opacity:0.5;cursor:default;pointer-events:none}
  .deck-card.locked:hover{transform:none;border-color:var(--border-dk)}
  .deck-card .dc-lock{font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-faint);margin-top:6px;display:flex;align-items:center;gap:5px}
  .deck-card .dc-lock::before{content:'🔒';font-size:0.65rem}

  /* Unlock notification on end screen */
  .unlock-banner{background:var(--green-bg);border:1.5px solid var(--green-border);border-left:4px solid var(--green);border-radius:var(--radius-sm);padding:12px 14px;animation:resultIn 0.4s ease}
  .unlock-banner .ub-label{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--green-dk);margin-bottom:4px}
  .unlock-banner .ub-title{font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:800;color:var(--text-hi);margin-bottom:2px}
  .unlock-banner .ub-reason{font-size:0.78rem;color:var(--text-mid);line-height:1.5}

  /* Gauntlet card */
  .deck-card.gauntlet{border-color:var(--amber);background:linear-gradient(135deg,var(--amber-bg),var(--surface2))}
  .deck-card.gauntlet .dc-badge{background:var(--amber)}

  /* Desktop: hub grid + reading comfort */
  @media (min-width: 540px) {
    .hub-body{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
    .deck-card .dc-desc{font-size:0.8rem;line-height:1.55}
    .result-feedback{line-height:1.7}
    .end-insight{line-height:1.8}
    .card-context{line-height:1.6}
    .start-hero{padding:40px 28px 32px}
    .hub-hero{padding:40px 28px 28px}
    .start-main-title{font-size:2.2rem}
    .start-body{padding:24px 24px}
    .end-body{padding:24px 22px}
    .card-outer{padding:16px 16px 0}
    .score-item{padding:11px 8px 10px}
    .score-item .s-value{font-size:1.4rem}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>

// ══════════════════════════════════════════════════════════════
// WALKTHROUGH (main deck only)
// ══════════════════════════════════════════════════════════════
const WALKTHROUGH = [
  {
    id:"wt-1", type:"work", category:"Tutorial",
    context:"A patient walks up to the desk while you're in the middle of entering data into Medflex. They look like they've been waiting.",
    question:"What do you do first?",
    choices:[
      {text:"Acknowledge them immediately — even a quick 'I'll be right with you' counts", scores:{clarity:2,composure:4,docs:1,voice:5,flow:3},
        feedback:"Right instinct. A patient who knows they've been seen will wait patiently. A patient who feels invisible will not. The acknowledgment doesn't mean you drop everything — it means you close the gap between their arrival and your attention.",
        tutorial:"<strong>This is the feedback.</strong> Every choice gets honest commentary — even the ones that score well. There's no 'correct answer' celebration here. The deck tells you what your choice bought and what it cost."
      },
      {text:"Finish your entry first — you'll lose the data if you stop mid-task", scores:{clarity:3,composure:1,docs:4,voice:-2,flow:2},
        feedback:"The data entry matters. But the patient standing in front of you doesn't know what you're typing or why. Thirty seconds of silence from behind a screen feels like being ignored. Finish the entry if it's truly one more keystroke — but acknowledge them first.",
        tutorial:"<strong>This is the feedback.</strong> Notice that this choice scored higher on Docs but lower on Voice. The deck doesn't punish you for protecting the data — it shows you the tradeoff. Real decisions always have tradeoffs."
      },
      {text:"Wave them over and try to help while still typing", scores:{clarity:-1,composure:2,docs:-2,voice:2,flow:1},
        feedback:"Split attention usually means both things get done at 60%. The entry gets a typo. The patient gets half your eye contact. If you're going to help them, help them. If you need to finish, say so and finish.",
        tutorial:"<strong>This is the feedback.</strong> Some choices score mixed or negative — not because they're stupid, but because the tradeoff doesn't hold up here. The deck respects every choice enough to explain <em>why</em>."
      }
    ],
    tags:["tutorial"]
  },
  {
    id:"wt-2", type:"work", category:"Tutorial",
    context:"You get a call from a patient who's clearly confused about when their next appointment is. You can see it in the system.",
    question:"How do you handle it?",
    choices:[
      {text:"Give them the date, time, and location clearly — then ask if they have any other questions", scores:{clarity:5,composure:3,docs:2,voice:5,flow:4},
        feedback:"Simple, complete, and professional. The 'any other questions' at the end is what turns a transaction into a service interaction.",
        tutorial:"<strong>About scoring.</strong> Your five scores update after each choice. They start at 50 and move based on your decisions. But here's the thing — <em>scoring has built-in variance</em>. Sometimes a strong choice gets muted. Sometimes a weak one partially recovers. That's intentional. Real work doesn't reward consistency perfectly either."
      },
      {text:"Read them the appointment details and move on to the next call", scores:{clarity:4,composure:3,docs:2,voice:2,flow:4},
        feedback:"Accurate and efficient. But 'move on to the next call' energy comes through the phone. The patient called because they were confused — the extra five seconds of warmth costs you nothing.",
        tutorial:"<strong>About scoring.</strong> This choice scored slightly lower on Voice but the same on Flow. Small differences between choices are normal — not every scenario has dramatic spread. Some decisions are genuinely close calls."
      },
      {text:"Tell them to check their email — the confirmation was sent when they booked", scores:{clarity:2,composure:1,docs:1,voice:-3,flow:3},
        feedback:"They called because they couldn't find it or didn't understand it. Sending them back to the email they already couldn't locate doesn't solve the problem — it just moves it off your desk temporarily.",
        tutorial:"<strong>About scoring.</strong> This one hit Voice hard. The deck doesn't just track whether you knew the right answer — it tracks <em>how you delivered it</em>. That's what the Voice axis measures."
      }
    ],
    tags:["tutorial"]
  },
  {
    id:"wt-3", type:"checkin", category:"Tutorial",
    context:"No scenario. Just a question to show you how check-ins work.",
    question:"When you're learning something new at work, what helps you most?",
    choices:[
      {text:"Doing it myself and figuring it out as I go", scores:{clarity:2,composure:3,docs:2,voice:2,flow:3},
        feedback:"Hands-on learning builds confidence fast. Just make sure 'figuring it out' includes asking when you're stuck — the fastest learners aren't the ones who never need help, they're the ones who know when to ask.",

// Axis → focus deck mapping (which weak axes unlock which focus decks)
const AXIS_UNLOCK_MAP = {
  clarity: 'insurance',
  docs: ['insurance', 'docsflow'],
  composure: 'communication',
  voice: 'communication',
  flow: 'docsflow'
};
const UNLOCK_THRESHOLD = 60;

// ══════════════════════════════════════════════════════════════
// PROGRESSION STORAGE
// ══════════════════════════════════════════════════════════════
const STORE_KEY = 'yanke_dd_progress';
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { unlocked: { main:true, insurance:false, communication:false, docsflow:false, gauntlet:false }, completed: {}, recentScores: [] };
}
function saveProgress(p) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch(e) {}
}

// ══════════════════════════════════════════════════════════════
// UNIFIED ENGINE
// ══════════════════════════════════════════════════════════════
class DecisionDeck {
  constructor() {
    this.state = 'hub';
    this.cfg = null;
    this.scores = { clarity:50, composure:50, docs:50, voice:50, flow:50 };
    this.progress = loadProgress();
    this.newUnlocks = [];
    this.round = 0;
    this.totalRounds = 14;
    this.history = [];
    this.currentScenario = null;
    this.selectedChoice = null;
    this.usedIds = new Set();
    this.deck = [];
    this.wtStep = 0;
    this.wtSelected = null;
    this.wtScores = { clarity:50, composure:50, docs:50, voice:50, flow:50 };
    this.render();
  }

  loadDeck(key) {
    this.cfg = DECKS[key];
    this.totalRounds = this.cfg.rounds;
    this.state = 'start';
    this.scores = { clarity:50, composure:50, docs:50, voice:50, flow:50 };
    this.round = 0;
    this.history = [];
    this.selectedChoice = null;
    this.usedIds = new Set();
    this.deck = [];
    this.render();
  }

  goHub() {
    this.state = 'hub';
    this.cfg = null;
    this.render();
  }

  buildDeck() {
    const scenarios = this.cfg.scenarios;
    if (this.usedIds.size >= scenarios.length) this.usedIds = new Set();
    let pool = scenarios.filter(s => !this.usedIds.has(s.id));
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    // Weighted selection: if main deck has recent scores, tilt toward weak axes
    if (this.cfg.key === 'main' && this.progress.recentScores.length > 0) {
      const recent = this.progress.recentScores;
      const avg = {};
      for (const ax of ['clarity','composure','docs','voice','flow']) {
        avg[ax] = recent.reduce((sum, r) => sum + (r[ax]||50), 0) / recent.length;
      }
      // Weight = how much each scenario tests weak axes (lower avg = higher weight)
      pool.sort((a, b) => {
        const scoreA = this._weaknessWeight(a, avg);
        const scoreB = this._weaknessWeight(b, avg);
        return scoreB - scoreA; // higher weight first
      });
      // Re-shuffle top third to avoid deterministic ordering, keep weak-heavy bias
      const third = Math.floor(pool.length / 3);
      for (let i = third - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
    const selected = [];
    const catCount = {};
    const typeCount = { work:0, checkin:0, offwork:0 };
    const guarantees = this.cfg.guarantees.map(g => {
      if (g === 'checkin') return pool.find(s => s.type === 'checkin' && !selected.includes(s));
      return pool.find(s => s.category === g && !selected.includes(s));
    }).filter(Boolean);
    for (const s of guarantees) {
      if (!selected.includes(s)) {
        selected.push(s);
        catCount[s.category] = (catCount[s.category]||0) + 1;
        typeCount[s.type] = (typeCount[s.type]||0) + 1;
      }
    }
    for (const s of pool) {
      if (selected.length >= this.totalRounds) break;
      if (selected.includes(s)) continue;
      const cc = catCount[s.category] || 0;
      if (cc >= 2) continue;
      if (s.type === 'checkin' && typeCount.checkin >= this.cfg.checkinCap) continue;
      selected.push(s);
      catCount[s.category] = cc + 1;
      typeCount[s.type] = (typeCount[s.type]||0) + 1;
    }
    for (const s of pool) {
      if (selected.length >= this.totalRounds) break;
      if (!selected.includes(s)) selected.push(s);
    }
    for (let i = selected.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [selected[i], selected[j]] = [selected[j], selected[i]];
    }
    if (selected[0] && selected[0].type === 'checkin') {
      const swap = selected.findIndex((s, i) => i > 2 && s.type === 'work');
      if (swap > 0) [selected[0], selected[swap]] = [selected[swap], selected[0]];
    }
    this.deck = selected;
  }

  _weaknessWeight(scenario, avgScores) {
    // How much does this scenario's "best" choice test the weakest axes?
    // Lower avg score = weaker axis = we want scenarios that score on it
    let weight = 0;
    const best = scenario.choices.reduce((a, b) => sum(a) > sum(b) ? a : b);
    function sum(c) { return Object.values(c.scores).reduce((a,b)=>a+b, 0); }
    for (const [ax, val] of Object.entries(best.scores)) {
      if (val > 0 && avgScores[ax] !== undefined) {
        // Invert: lower avg = higher weight for this axis
        weight += val * Math.max(0, (75 - avgScores[ax]) / 25);
      }
    }
    return weight;
  }

  findCallback() {
    if (this.history.length < this.cfg.callbackMinHistory || !this.currentScenario) return null;
    const cur = this.currentScenario;
    const scenarios = this.cfg.scenarios;
    const overlap = this.history.filter(h => {
      const past = scenarios.find(s => s.id === h.id);
      return past && past.tags && cur.tags && past.tags.some(t => cur.tags.includes(t));
    });
    if (overlap.length > 0) {
      const ref = overlap[overlap.length - 1];
      const past = scenarios.find(s => s.id === ref.id);
      return `Earlier in ${past.category}, you chose: "${ref.choiceText}" — keep that in mind here.`;
    }
    return null;
  }

  applyVariance(scores) {
    const m = {};
    for (const k of Object.keys(scores)) m[k] = Math.round(scores[k] * 0.5);
    const roll = Math.random();
    const keys = Object.keys(m);
    const p = keys[0]; const s = keys[1];
    if (roll < 0.15 && m[p] > 3) m[p] = Math.round(m[p]*0.35);
    else if (roll < 0.28 && m[p] < -2) m[s] = Math.abs(m[s])+2;
    else if (roll < 0.40) { const pk = keys[Math.floor(Math.random()*keys.length)]; if (Math.abs(m[pk]) > 2) m[pk] = -Math.round(m[pk]*0.4); }
    else if (roll < 0.48) { const pk = keys[Math.floor(Math.random()*keys.length)]; m[pk] += (Math.random() > 0.5 ? 3 : -3); }
    return m;
  }

  nextRound() {
    if (this.round >= this.totalRounds) { this.finishRun(); this.state = 'end'; this.render(); return; }
    this.currentScenario = this.deck[this.round] || null;
    if (!this.currentScenario) { this.state = 'hub'; this.render(); return; }
    this.usedIds.add(this.currentScenario.id);
    this.selectedChoice = null;
    this.state = 'play';
    this.render();
  }

  finishRun() {
    this.newUnlocks = [];
    const p = this.progress;
    const key = this.cfg.key;

    // Mark deck completed
    p.completed[key] = true;

    // Store recent scores (keep last 3 main deck runs for weighting)
    if (key === 'main') {
      p.recentScores.push({...this.scores});
      if (p.recentScores.length > 3) p.recentScores.shift();

      // Check unlock thresholds — axes ≤60 unlock mapped focus decks
      const axes = ['clarity','composure','docs','voice','flow'];
      for (const ax of axes) {
        if (this.scores[ax] <= UNLOCK_THRESHOLD) {
          const targets = AXIS_UNLOCK_MAP[ax];
          const arr = Array.isArray(targets) ? targets : [targets];
          for (const dk of arr) {
            if (!p.unlocked[dk]) {
              p.unlocked[dk] = true;
              this.newUnlocks.push(dk);
            }
          }
        }
      }
    }

    // Check gauntlet unlock: all three focus decks completed
    if (p.completed.insurance && p.completed.communication && p.completed.docsflow) {
      if (!p.unlocked.gauntlet) {
        p.unlocked.gauntlet = true;
        this.newUnlocks.push('gauntlet');
      }
    }

    saveProgress(p);
  }

  selectChoice(index) {
    if (this.selectedChoice !== null) return;
    this.selectedChoice = index;
    const choice = this.currentScenario.choices[index];
    const mod = this.applyVariance(choice.scores);
    for (const k of Object.keys(this.scores)) this.scores[k] = Math.max(0, Math.min(100, this.scores[k] + (mod[k]||0)));
    this.history.push({ id: this.currentScenario.id, choiceIndex: index, choiceText: choice.text, scores: mod });
    this.round++;
    this.render();
  }

  start() {
    this.scores = { clarity:50, composure:50, docs:50, voice:50, flow:50 };
    this.round = 0;
    this.history = [];
    this.selectedChoice = null;
    this.usedIds = new Set();
    this.buildDeck();
    this.nextRound();
  }

  startWalkthrough() {
    this.state = 'walkthrough';
    this.wtStep = 0;
    this.wtSelected = null;
    this.wtScores = { clarity:50, composure:50, docs:50, voice:50, flow:50 };
    this.render();
  }

  wtSelectChoice(index) {
    if (this.wtSelected !== null) return;
    this.wtSelected = index;
    const choice = WALKTHROUGH[this.wtStep].choices[index];
    for (const k of Object.keys(this.wtScores)) this.wtScores[k] = Math.max(0, Math.min(100, this.wtScores[k] + Math.round((choice.scores[k]||0) * 0.5)));
    this.render();
  }

  wtNext() {
    this.wtStep++;
    this.wtSelected = null;
    if (this.wtStep >= WALKTHROUGH.length) { this.state = 'wt-done'; }
    this.render();
  }

  resetProgress() {
    if (!confirm('Reset all progress? This clears unlocks, completion flags, and score history.')) return;
    localStorage.removeItem(STORE_KEY);
    this.progress = loadProgress();
    this.state = 'hub';
    this.cfg = null;
    this.render();
  }

              <div class="start-axes">
                <div class="axis-row clarity-row"><span class="axis-name clarity">Clarity</span><span class="axis-desc">Policy and process knowledge — knowing the right answer</span></div>
                <div class="axis-row composure-row"><span class="axis-name composure">Composure</span><span class="axis-desc">Handling pressure, difficult patients, and judgment calls</span></div>
                <div class="axis-row docs-row"><span class="axis-name docs">Docs</span><span class="axis-desc">Closing the loop — WIP, Medflex, follow-up documentation</span></div>
                <div class="axis-row voice-row"><span class="axis-name voice">Voice</span><span class="axis-desc">How clearly you communicate — tone, explanation, expectations</span></div>
                <div class="axis-row flow-row"><span class="axis-name flow">Flow</span><span class="axis-desc">Keeping the desk moving — prioritizing, multitasking, no bottlenecks</span></div>
              </div>
              <div class="start-divider"></div>
              <div class="start-note">${cfg.rounds} scenarios per run drawn from a pool of ${cfg.scenarios.length}. Scoring varies — some right answers don't score the way you expect. That's intentional.</div>
              <button class="start-btn" onclick="deck.startWalkthrough()">How This Works</button>
              <button class="start-btn" style="background:var(--surface);color:var(--text-hi);border:1.5px solid var(--border-dk);margin-top:-4px;" onclick="deck.start()">Skip to Training</button>
            ` : `
              <div class="start-note" style="font-size:0.85rem;color:var(--text-mid);line-height:1.65;">This is a <strong>focused deck</strong> — ${cfg.rounds} scenarios per run drawn from a pool of ${cfg.scenarios.length}, all centered on ${cfg.title.toLowerCase()}. Same five axes, same scoring variance, same honest feedback. Tighter scope, deeper practice.</div>
              <div class="start-divider"></div>
              <button class="start-btn" style="color:${cfg.badgeColor}" onclick="deck.start()">Begin Focus Training</button>
            `}
            <button class="back-btn" onclick="deck.goHub()">← Back to Menu</button>
          </div>
        </div>`;
      return;
    }

    // ── WALKTHROUGH ──
    if (this.state === 'walkthrough') {
      const s = WALKTHROUGH[this.wtStep];
      const sel = this.wtSelected;
      const choice = sel !== null ? s.choices[sel] : null;
      const isCheckin = s.type === 'checkin';
      const stepLabels = ['1 of 3 — Practice Round','2 of 3 — Practice Round','3 of 3 — Practice Round'];
      let choicesHTML = '';
      if (sel === null) {
        choicesHTML = `<div class="choices">${s.choices.map((c,i)=>`<button class="choice-btn" onclick="deck.wtSelectChoice(${i})">${c.text}</button>`).join('')}</div>`;
      } else {
        const dom = Object.entries(choice.scores).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
        const dv=dom[1]; const dc=dv>0?'pos':dv<0?'neg':'zero'; const ds=dv>0?'+':'';
        const al={clarity:'Clarity',composure:'Composure',docs:'Docs',voice:'Voice',flow:'Flow'};
        choicesHTML = `
          <div class="choices">${s.choices.map((c,i)=>`<button class="choice-btn${i===sel?' selected':''}" disabled>${c.text}</button>`).join('')}</div>
          <div class="result">
            <div class="result-score-block"><div class="result-delta ${dc}">${ds}${dv}</div><div class="result-stat-info"><span class="result-axis">${al[dom[0]]}</span><span class="result-now">Now: ${this.wtScores[dom[0]]}</span></div></div>
            <div class="result-feedback">${choice.feedback}</div>
            <div class="wt-tutorial">${choice.tutorial}</div>
            <button class="next-btn" onclick="deck.wtNext()">${this.wtStep >= WALKTHROUGH.length-1 ? 'Finish Walkthrough' : 'Next Practice →'}</button>
          </div>`;
      }
      app.innerHTML = `
        <div class="header"><div class="header-left"><span class="header-eyebrow">Yanke Bionics</span><span class="header-title">Front Desk Training</span></div><span class="header-badge" style="background:var(--composure);color:#fff;">Learn</span></div>
        <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${((this.wtStep+(sel!==null?0.5:0))/WALKTHROUGH.length)*100}%;background:linear-gradient(90deg,var(--composure),#9a70d8);"></div></div><div class="progress-label">${stepLabels[this.wtStep]}</div></div>
        <div class="score-bar">
          <div class="score-item clarity-item"><span class="s-label">Clarity</span><span class="s-value clarity">${this.wtScores.clarity}</span></div>
          <div class="score-item composure-item"><span class="s-label">Composure</span><span class="s-value composure">${this.wtScores.composure}</span></div>
          <div class="score-item docs-item"><span class="s-label">Docs</span><span class="s-value docs">${this.wtScores.docs}</span></div>
          <div class="score-item voice-item"><span class="s-label">Voice</span><span class="s-value voice">${this.wtScores.voice}</span></div>
          <div class="score-item flow-item"><span class="s-label">Flow</span><span class="s-value flow">${this.wtScores.flow}</span></div>
        </div>
        <div class="card-outer"><div class="card">
          <div class="card-accent-bar${isCheckin?' checkin':''}"></div>
          <div class="card-body">
            <div class="card-meta"><span class="card-category${isCheckin?' checkin':''}">${s.category}</span><span class="card-num" style="color:var(--composure);">Practice</span></div>
            <div class="card-context">${s.context}</div>
            <div class="card-question">${s.question}</div>
          </div>
          ${choicesHTML}
        </div></div>`;
      return;
    }

    // ── WALKTHROUGH DONE ──
    if (this.state === 'wt-done') {
      app.innerHTML = `
        <div class="header"><div class="header-left"><span class="header-eyebrow">Yanke Bionics</span><span class="header-title">Front Desk Training</span></div><span class="header-badge">v2</span></div>
        <div class="start-screen">
          <div class="start-hero" style="padding:28px 22px 24px;">
            <span class="start-eyebrow" style="color:var(--composure);">Walkthrough Complete</span>
            <div class="start-main-title" style="font-size:1.6rem;">You've Got<br>the Basics</div>
            <div class="start-sub">That's how the deck works. Read a scenario, make a choice, get honest feedback. Scores move. Some surprises happen. No perfect runs.</div>
          </div>
          <div class="start-body">
            <div style="font-size:0.85rem;color:var(--text-mid);line-height:1.65;">
              <p style="margin-bottom:12px;"><strong style="color:var(--text-hi);">The real run</strong> is ${this.cfg.rounds} scenarios drawn from a pool of ${this.cfg.scenarios.length}. You'll see a mix of categories — calls, scheduling, insurance, documentation, compliance, and more. A few check-ins. A few off-the-clock scenarios that use the same scoring axes through a personal lens.</p>
              <p style="margin-bottom:12px;">The variance system means your scores won't always match your expectations. A strong choice might get muted. A weak one might partially recover. <strong style="color:var(--text-hi);">That's not a bug — it's the point.</strong> Real desk work doesn't reward consistency perfectly either.</p>
              <p>At the end, you'll get a reading based on your overall pattern — not just a number, but what that number means for how you're operating at the desk.</p>
            </div>
            <div class="start-divider"></div>
            <button class="start-btn" onclick="deck.start()">Begin Training</button>
            <button class="back-btn" onclick="deck.goHub()">← Back to Menu</button>
          </div>
        </div>`;
      return;
    }

    // ── END SCREEN ──
    if (this.state === 'end') {
      const insight = cfg.getEndInsight(this.scores, this.history);
      const paras = insight.split('\n\n');
      const unlockNames = { insurance:'Insurance & Compliance', communication:'Patient Communication', docsflow:'Documentation & Flow', gauntlet:'The Gauntlet' };
      const unlockColors = { insurance:'var(--clarity)', communication:'var(--voice)', docsflow:'var(--flow)', gauntlet:'var(--amber)' };
      const unlockReasons = { insurance:'Clarity or Docs scored ≤60', communication:'Voice or Composure scored ≤60', docsflow:'Docs or Flow scored ≤60', gauntlet:'All three focus decks completed' };
      const unlockHTML = (this.newUnlocks && this.newUnlocks.length > 0)
        ? this.newUnlocks.map(dk => `
          <div class="unlock-banner">
            <div class="ub-label">Unlocked</div>
            <div class="ub-title" style="color:${unlockColors[dk]||'var(--green)'}">${unlockNames[dk]||dk}</div>
            <div class="ub-reason">${unlockReasons[dk]||''}</div>
          </div>`).join('')
        : '';
      app.innerHTML = `
        <div class="header"><div class="header-left"><span class="header-eyebrow">Yanke Bionics</span><span class="header-title">${cfg.title}</span></div><span class="header-badge" style="background:${cfg.badgeColor};color:${cfg.badgeTextColor}">${cfg.badge}</span></div>
        <div class="end-screen">
          <div class="end-hero" style="border-bottom:3px solid ${cfg.accentColor}">
            <div class="end-eyebrow" style="color:${cfg.accentColor}">Run Complete</div>
            <div class="end-title">Your Results</div>
          </div>
          <div class="end-scores">
            <div class="end-stat e-clarity"><div class="end-val" style="color:var(--clarity)">${this.scores.clarity}</div><div class="end-lbl">Clarity</div></div>
            <div class="end-stat e-composure"><div class="end-val" style="color:var(--composure)">${this.scores.composure}</div><div class="end-lbl">Composure</div></div>
            <div class="end-stat e-docs"><div class="end-val" style="color:var(--docs)">${this.scores.docs}</div><div class="end-lbl">Docs</div></div>
            <div class="end-stat e-voice"><div class="end-val" style="color:var(--voice)">${this.scores.voice}</div><div class="end-lbl">Voice</div></div>
            <div class="end-stat e-flow"><div class="end-val" style="color:var(--flow)">${this.scores.flow}</div><div class="end-lbl">Flow</div></div>
          </div>
          <div class="end-body">
            ${paras.map(p=>`<p class="end-insight">${p}</p>`).join('<div class="end-divider"></div>')}
            ${unlockHTML ? '<div class="end-divider"></div>' + unlockHTML : ''}
            <div class="end-divider"></div>
            <button class="play-again" style="color:${cfg.accentColor}" onclick="deck.start()">Run Again</button>
            <button class="back-btn" onclick="deck.goHub()">← Back to Menu</button>
          </div>
        </div>`;
      return;
    }

    // ── PLAY STATE ──
    const s = this.currentScenario;
    if (!s) { app.innerHTML = '<div style="padding:40px;text-align:center;color:#888">Loading...</div>'; return; }
    const callback = this.findCallback();
    const selected = this.selectedChoice;
    const choice = selected !== null ? s.choices[selected] : null;
    const modScores = selected !== null ? this.history[this.history.length-1].scores : null;
    const isCheckin = s.type === 'checkin';
    const isOffwork = s.type === 'offwork';

    let choicesHTML = '';
    if (selected === null) {
      choicesHTML = `<div class="choices">${s.choices.map((c,i)=>`<button class="choice-btn" onclick="deck.selectChoice(${i})">${c.text}</button>`).join('')}</div>`;
    } else {
      const dom = Object.entries(modScores).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
      const dv=dom[1]; const dc=dv>0?'pos':dv<0?'neg':'zero'; const ds=dv>0?'+':'';
      const al={clarity:'Clarity',composure:'Composure',docs:'Docs',voice:'Voice',flow:'Flow'};
      choicesHTML = `
        <div class="choices">${s.choices.map((c,i)=>`<button class="choice-btn${i===selected?' selected':''}" disabled>${c.text}</button>`).join('')}</div>
        <div class="result">
          <div class="result-score-block"><div class="result-delta ${dc}">${ds}${dv}</div><div class="result-stat-info"><span class="result-axis">${al[dom[0]]}</span><span class="result-now">Now: ${this.scores[dom[0]]}</span></div></div>
          <div class="result-feedback">${choice.feedback}</div>
          <button class="next-btn" style="color:${cfg.accentColor}" onclick="deck.nextRound()">${this.round >= this.totalRounds ? 'See Results' : 'Next Scenario'} →</button>
        </div>`;
    }

    app.innerHTML = `
      <div class="header"><div class="header-left"><span class="header-eyebrow">Yanke Bionics</span><span class="header-title">${cfg.title}</span></div><span class="header-badge" style="background:${cfg.badgeColor};color:${cfg.badgeTextColor}">${cfg.badge}</span></div>
      <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${(this.round/this.totalRounds)*100}%;background:linear-gradient(90deg,${cfg.accentColor},${cfg.accentColor})"></div></div><div class="progress-label">${this.round} / ${this.totalRounds}</div></div>
      <div class="score-bar">
        <div class="score-item clarity-item"><span class="s-label">Clarity</span><span class="s-value clarity">${this.scores.clarity}</span></div>
        <div class="score-item composure-item"><span class="s-label">Composure</span><span class="s-value composure">${this.scores.composure}</span></div>
        <div class="score-item docs-item"><span class="s-label">Docs</span><span class="s-value docs">${this.scores.docs}</span></div>
        <div class="score-item voice-item"><span class="s-label">Voice</span><span class="s-value voice">${this.scores.voice}</span></div>
        <div class="score-item flow-item"><span class="s-label">Flow</span><span class="s-value flow">${this.scores.flow}</span></div>
      </div>
      <div class="card-outer"><div class="card">
        <div class="card-accent-bar${isCheckin?' checkin':''}${isOffwork?' offwork':''}"></div>
        <div class="card-body">
          <div class="card-meta"><span class="card-category${isCheckin?' checkin':''}">${s.category}</span><span class="card-num">${this.round} / ${this.totalRounds}</span></div>
          <div class="card-context">${s.context}</div>
          ${callback && selected === null ? `<div class="card-callback"><span class="callback-tag">Related</span>${callback}</div>` : ''}
          <div class="card-question">${s.question}</div>
        </div>
        ${choicesHTML}
      </div></div>`;
  }
}

const deck = new DecisionDeck();
</script>
</body>
</html>
